<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments & Labs | ME Section Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#090d16',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-brandDark text-slate-100 min-h-screen font-sans antialiased pb-20 lg:pb-8 flex flex-col justify-between">

    <!-- MOBILE STICKY HEADER -->
<!-- Single Navbar Anchor -->
<div id="navbar-container"></div>

<!-- Load Navbar Script -->
<script src="navbar.js"></script>

    <!-- MAIN BODY CONTENT -->
    <main class="max-w-4xl mx-auto px-3.5 sm:px-6 py-6 space-y-6 flex-1 w-full">

        <!-- PAGE HERO BANNER -->
        <section class="rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-amber-950/40 border border-amber-500/30 p-5 sm:p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex items-center space-x-3 mb-2">
                <div class="p-2 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
                    <i data-lucide="check-square" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-300 border border-amber-500/20 uppercase tracking-wider">
                        Academic Portal
                    </span>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Assignments & Lab Reports</h1>
                </div>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed mt-2">
                Find all posted homework, problem sets, lab task sheets, and submission details below.
            </p>
        </section>

        <!-- DYNAMIC FIRESTORE ASSIGNMENTS CONTAINER -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
                    <i data-lucide="list-todo" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>Active Tasks</span>
                </h2>
                <span class="text-[11px] text-slate-500">Auto-synced</span>
            </div>

            <!-- Injected by app.js -->
            <div id="assignment-container" class="space-y-4">
                <div class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 text-center text-slate-400 text-xs animate-pulse">
                    Loading assignments...
                </div>
            </div>
        </section>

    </main>

    <!-- DARK THEMED FILE PREVIEW MODAL -->
    <div id="file-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-3 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-slate-950 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2 truncate">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-400 shrink-0"></i>
                    <h3 id="modal-title" class="font-bold text-sm text-white truncate">File Preview</h3>
                </div>
                <div class="flex items-center space-x-2 shrink-0">
                    <a id="modal-download-btn" href="#" target="_blank" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1">
                        <span>Open in Drive</span>
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                    <button id="close-modal-btn" class="p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition text-xl font-bold leading-none">&times;</button>
                </div>
            </div>
            <!-- Modal Body -->
            <div class="flex-1 bg-slate-950/50 p-2 flex items-center justify-center overflow-hidden">
                <iframe id="modal-iframe" src="" class="w-full h-full border-0 rounded-xl bg-white" style="display: none;"></iframe>
                <img id="modal-img" src="" class="max-w-full max-h-full object-contain rounded-xl" style="display: none;" />
            </div>
        </div>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2 flex justify-around items-center">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400 transition">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium mt-0.5">Home</span>
        </a>
        <a href="ct-updates.html" class="flex flex-col items-center text-slate-400 hover:text-rose-400 transition">
            <i data-lucide="file-text" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium mt-0.5">CTs</span>
        </a>
        <a href="assignments.html" class="flex flex-col items-center text-amber-400">
            <i data-lucide="check-square" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium mt-0.5">Tasks</span>
        </a>
        <a href="admin-dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-400 transition">
            <i data-lucide="shield" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium mt-0.5">Admin</span>
        </a>
    </nav>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-800/60 py-4 text-center text-[11px] text-slate-500">
        <p>© Mechanical Engineering Section Hub</p>
    </footer>

    <!-- Initialize Vector Icons -->
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
